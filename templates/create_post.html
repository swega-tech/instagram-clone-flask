{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card p-4 shadow-sm bg-white">
        <h2 class="mb-4 text-center">{{ legend }}</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Post Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ post.title if post else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="image_url" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="image_url" name="image_url" value="{{ post.image_url if post else '' }}" placeholder="https://example.com/image.jpg">
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">Caption / Description</label>
                <textarea class="form-control" id="content" name="content" rows="4" required>{{ post.content if post else '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Publish Post</button>
        </form>
    </div>
</div>
{% endblock %}
