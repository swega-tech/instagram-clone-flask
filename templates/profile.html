{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="card p-4 mb-4 bg-white shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-3 text-center">
                <img src="https://via.placeholder.com/150" class="rounded-circle img-fluid" alt="Avatar">
            </div>
            <div class="col-md-9">
                <h2>@{{ user.username }}</h2>
                <p class="text-muted">{{ user.email }}</p>
                <p class="lead">{{ user.bio }}</p>
                <span class="badge bg-secondary">Posts: {{ user.posts|length }}</span>
            </div>
        </div>
    </div>

    <h3 class="mt-4 mb-3 text-center">User Gallery</h3>
    <div class="row">
        {% for post in user.posts %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <img src="{{ post.image_url }}" class="card-img-top" alt="Image" style="height: 250px; object-fit: cover;">
                    <div class="card-body">
                        <h5><a href="{{ url_for('post_detail', post_id=post.id) }}" class="text-decoration-none text-dark">{{ post.title }}</a></h5>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
