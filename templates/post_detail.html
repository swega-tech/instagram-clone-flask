{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white d-flex align-items-center">
                <a href="{{ url_for('profile', user_id=post.author.id) }}" class="fw-bold text-decoration-none text-dark">
                    @{{ post.author.username }}
                </a>
                <small class="text-muted ms-auto">{{ post.date_posted.strftime('%Y-%m-%d') }}</small>
            </div>
            <img src="{{ post.image_url }}" class="card-img-top" alt="Post Image">
            <div class="card-body">
                <h3 class="card-title">{{ post.title }}</h3>
                <p class="card-text text-secondary">{{ post.content }}</p>
                <hr>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('update_post', post_id=post.id) }}" class="btn btn-sm btn-outline-info">Edit</a>
                    <form action="{{ url_for('delete_post', post_id=post.id) }}" method="POST">
                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this post?')">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
